# Exported from wickd (Executive Overview)
title: Executive Overview
text: Exported from the wickd dashboard **Executive Overview** for 2026-10-01 – 2026-10-31 (fixed dates).
queries:
  avg_discount: |-
    SELECT
      AVG(avg_discount_pct) AS avg_discount
    FROM {{ ref('mart_sales_analytics') }} mart_sales_src_10000
    WHERE DATE_TRUNC('day', order_date) BETWEEN '2026-10-01' AND '2026-10-31'
  gross_revenue: |-
    SELECT
      SUM(gross_amount_dollars) AS gross_revenue
    FROM {{ ref('int_sales_enriched') }} orders_src_10000
    WHERE DATE_TRUNC('day', order_date) BETWEEN '2026-10-01' AND '2026-10-31'
  summary_2: |-
    SELECT
      SUM(gross_margin_dollars) AS gross_margin
    FROM {{ ref('int_sales_enriched') }} orders_src_10000
    WHERE DATE_TRUNC('day', order_date) BETWEEN '2026-10-01' AND '2026-10-31'
  orders_count: |-
    SELECT
      MAX(subq_6.orders_count) AS orders_count
      , MAX(subq_13.customer_lifetime_revenue) AS customer_lifetime_revenue
      , MAX(subq_21.conversion_rate) AS conversion_rate
    FROM (
      SELECT
        SUM(orders_count) AS orders_count
      FROM {{ ref('int_customer_orders') }} customer_orders_src_10000
      WHERE DATE_TRUNC('day', first_order_date) BETWEEN '2026-10-01' AND '2026-10-31'
    ) subq_6
    CROSS JOIN (
      SELECT
        SUM(lifetime_net_revenue) AS customer_lifetime_revenue
      FROM {{ ref('mart_customer_360') }} customers_src_10000
      WHERE DATE_TRUNC('day', signup_date) BETWEEN '2026-10-01' AND '2026-10-31'
    ) subq_13
    CROSS JOIN (
      SELECT
        CAST(SUM(case when converted then 1 else 0 end) AS DOUBLE) / CAST(NULLIF(COUNT(DISTINCT session_id), 0) AS DOUBLE) AS conversion_rate
      FROM {{ ref('int_ga_sessions_cleaned') }} web_sessions_src_10000
      WHERE DATE_TRUNC('day', session_date) BETWEEN '2026-10-01' AND '2026-10-31'
    ) subq_21
  summary: |-
    SELECT
      SUM(discount_dollars) AS discounts
      , SUM(quantity) AS units_sold
      , SUM(net_amount_dollars) AS revenue
    FROM {{ ref('int_sales_enriched') }} orders_src_10000
    WHERE DATE_TRUNC('day', order_date) BETWEEN '2026-10-01' AND '2026-10-31'
  bounce_rate: |-
    SELECT COALESCE(customer__loyalty_tier, 'Unknown') AS customer__loyalty_tier, session__device_category, bounce_rate
    FROM (
      SELECT
        session__device_category
        , customer__loyalty_tier
        , CAST(bounces AS DOUBLE) / CAST(NULLIF(sessions, 0) AS DOUBLE) AS bounce_rate
      FROM (
        SELECT
          subq_2.session__device_category AS session__device_category
          , customers_src_10000.loyalty_tier AS customer__loyalty_tier
          , SUM(subq_2.__bounces) AS bounces
          , COUNT(DISTINCT subq_2.__sessions) AS sessions
        FROM (
          SELECT
            customer_id AS customer
            , device_category AS session__device_category
            , session_id AS __sessions
            , case when is_bounced then 1 else 0 end AS __bounces
          FROM {{ ref('int_ga_sessions_cleaned') }} web_sessions_src_10000
          WHERE DATE_TRUNC('day', session_date) BETWEEN '2026-10-01' AND '2026-10-31'
        ) subq_2
        LEFT OUTER JOIN
          {{ ref('mart_customer_360') }} customers_src_10000
        ON
          subq_2.customer = customers_src_10000.customer_id
        GROUP BY
          subq_2.session__device_category
          , customers_src_10000.loyalty_tier
      ) subq_10
    ) AS wickd_q
  leaderboard: |-
    SELECT
      order__subcategory
      , SUM(web_revenue) AS web_revenue
    FROM (
      SELECT
        channel AS order__channel
        , subcategory AS order__subcategory
        , net_amount_dollars AS web_revenue
      FROM {{ ref('int_sales_enriched') }} orders_src_10000
      WHERE DATE_TRUNC('day', order_date) BETWEEN '2026-10-01' AND '2026-10-31'
    ) subq_3
    WHERE order__channel = 'web'
    GROUP BY
      order__subcategory
    ORDER BY web_revenue DESC
    LIMIT 10
  table: |-
    SELECT
      subq_2.customer__loyalty_tier AS customer__loyalty_tier
      , customer_orders_src_10000.first_name AS customer__first_name
      , customer_orders_src_10000.last_name AS customer__last_name
      , SUM(subq_2.__customer_lifetime_revenue) AS customer_lifetime_revenue
    FROM (
      SELECT
        customer_id AS customer
        , loyalty_tier AS customer__loyalty_tier
        , lifetime_net_revenue AS __customer_lifetime_revenue
      FROM {{ ref('mart_customer_360') }} customers_src_10000
      WHERE DATE_TRUNC('day', signup_date) BETWEEN '2026-10-01' AND '2026-10-31'
    ) subq_2
    LEFT OUTER JOIN
      {{ ref('int_customer_orders') }} customer_orders_src_10000
    ON
      subq_2.customer = customer_orders_src_10000.customer_id
    GROUP BY
      subq_2.customer__loyalty_tier
      , customer_orders_src_10000.first_name
      , customer_orders_src_10000.last_name
    ORDER BY customer_lifetime_revenue DESC
    LIMIT 10
  sessions: "SELECT COALESCE(session__traffic_category, 'Unknown') AS session__traffic_category, metric_time__day, sessions,\
    \ conversions, conversion_rate, bounce_rate\nFROM (\n  WITH sma_10006_cte AS (\n    SELECT\n      DATE_TRUNC('day', session_date)\
    \ AS metric_time__day\n      , traffic_category AS session__traffic_category\n      , session_id AS __sessions\n     \
    \ , case when converted then 1 else 0 end AS __conversions\n      , case when is_bounced then 1 else 0 end AS __bounces\n\
    \    FROM {{ ref('int_ga_sessions_cleaned') }} web_sessions_src_10000\n  )\n  \n  SELECT\n    COALESCE(subq_6.metric_time__day,\
    \ subq_12.metric_time__day) AS metric_time__day\n    , COALESCE(subq_6.session__traffic_category, subq_12.session__traffic_category)\
    \ AS session__traffic_category\n    , MAX(subq_6.sessions) AS sessions\n    , MAX(subq_6.conversions) AS conversions\n\
    \    , MAX(CAST(subq_12.conversions AS DOUBLE) / CAST(NULLIF(subq_12.sessions, 0) AS DOUBLE)) AS conversion_rate\n   \
    \ , MAX(CAST(subq_12.bounces AS DOUBLE) / CAST(NULLIF(subq_12.sessions, 0) AS DOUBLE)) AS bounce_rate\n  FROM (\n    SELECT\n\
    \      metric_time__day\n      , session__traffic_category\n      , COUNT(DISTINCT __sessions) AS sessions\n      , SUM(__conversions)\
    \ AS conversions\n    FROM sma_10006_cte\n    WHERE metric_time__day BETWEEN '2026-10-01' AND '2026-10-31'\n    GROUP\
    \ BY\n      metric_time__day\n      , session__traffic_category\n  ) subq_6\n  FULL OUTER JOIN (\n    SELECT\n      metric_time__day\n\
    \      , session__traffic_category\n      , SUM(__conversions) AS conversions\n      , COUNT(DISTINCT __sessions) AS sessions\n\
    \      , SUM(__bounces) AS bounces\n    FROM sma_10006_cte\n    WHERE metric_time__day BETWEEN '2026-10-01' AND '2026-10-31'\n\
    \    GROUP BY\n      metric_time__day\n      , session__traffic_category\n  ) subq_12\n  ON\n    (\n      subq_6.session__traffic_category\
    \ = subq_12.session__traffic_category\n    ) AND (\n      subq_6.metric_time__day = subq_12.metric_time__day\n    )\n\
    \  GROUP BY\n    COALESCE(subq_6.metric_time__day, subq_12.metric_time__day)\n    , COALESCE(subq_6.session__traffic_category,\
    \ subq_12.session__traffic_category)\n) AS wickd_q"
  revenue: |-
    WITH cm_5_cte AS (
      SELECT
        customers_src_10000.loyalty_tier AS customer__loyalty_tier
        , SUM(subq_2.__revenue) AS revenue
        , COUNT(DISTINCT subq_2.__buyers) AS buyers
      FROM (
        SELECT
          customer_id AS customer
          , net_amount_dollars AS __revenue
          , customer_id AS __buyers
        FROM {{ ref('int_sales_enriched') }} orders_src_10000
        WHERE DATE_TRUNC('day', order_date) BETWEEN '2026-10-01' AND '2026-10-31'
      ) subq_2
      LEFT OUTER JOIN
        {{ ref('mart_customer_360') }} customers_src_10000
      ON
        subq_2.customer = customers_src_10000.customer_id
      GROUP BY
        customers_src_10000.loyalty_tier
    )

    SELECT
      COALESCE(cm_5_cte.customer__loyalty_tier, subq_12.customer__loyalty_tier) AS customer__loyalty_tier
      , MAX(cm_5_cte.revenue) AS revenue
      , MAX(cm_5_cte.buyers) AS buyers
      , MAX(subq_12.revenue_per_buyer) AS revenue_per_buyer
    FROM cm_5_cte
    FULL OUTER JOIN (
      SELECT
        customer__loyalty_tier
        , revenue / buyers AS revenue_per_buyer
      FROM (
        SELECT
          customer__loyalty_tier
          , revenue
          , buyers
        FROM cm_5_cte
      ) subq_11
    ) subq_12
    ON
      cm_5_cte.customer__loyalty_tier = subq_12.customer__loyalty_tier
    GROUP BY
      COALESCE(cm_5_cte.customer__loyalty_tier, subq_12.customer__loyalty_tier)
    ORDER BY revenue DESC
    LIMIT 10
